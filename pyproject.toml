[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-short-video-factory"
version = "0.1.0"
description = "Narration-first, agent-orchestrated AI Shorts production factory"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
svf = "shorts_factory.cli:app"

[tool.setuptools.packages.find]
include = ["shorts_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
