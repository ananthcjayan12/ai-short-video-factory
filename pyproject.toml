[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-short-video-factory"
version = "0.1.0"
description = "Narration-first, agent-orchestrated AI Shorts production factory"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "typer>=0.12,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ai = ["google-genai>=1.0,<2"]
alignment = ["openai-whisper>=20231117"]

[project.scripts]
svf = "shorts_factory.cli:app"

[tool.setuptools.packages.find]
include = ["shorts_factory*"]

[tool.setuptools.package-data]
shorts_factory = ["prompt_templates/*.json", "prompt_templates/*.md", "prompt_templates/*.txt", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
